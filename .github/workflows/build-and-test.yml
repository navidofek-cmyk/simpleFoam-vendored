name: Build & Test

on:
  push:
    branches: [master, main]
    paths:
      - 'CMakeLists.txt'
      - 'Dockerfile.build'
      - 'Dockerfile.base'
      - 'vendor/**'
      - 'solver/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SOLVER_IMAGE: ghcr.io/${{ github.repository_owner }}/simplefoam-vendored-build
  BASE_IMAGE:   ghcr.io/${{ github.repository_owner }}/openfoam10-base

jobs:
  # ── Job 1: build images and push to ghcr.io ─────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push OF base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.BASE_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.BASE_IMAGE }}:cache,mode=max

      - name: Build & push solver image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: ${{ env.SOLVER_IMAGE }}:latest,${{ env.SOLVER_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.SOLVER_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.SOLVER_IMAGE }}:cache,mode=max

  # ── Job 2: run tests using pre-built images ──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker pull ${{ env.SOLVER_IMAGE }}:latest
          docker pull ${{ env.BASE_IMAGE }}:latest
          docker tag ${{ env.SOLVER_IMAGE }}:latest simplefoam-vendored-build:latest
          docker tag ${{ env.BASE_IMAGE }}:latest   openfoam10-base:latest

      - name: Extract solver binary
        run: |
          docker create --name tmp simplefoam-vendored-build:latest
          docker cp tmp:/build/build/simpleFoamExtracted ./simpleFoamExtracted
          docker rm tmp
          ls -lh simpleFoamExtracted

      - name: Test — pitzDaily serial (smoke + regression + performance)
        run: |
          docker build --no-cache -f - -t test-serial . << 'DOCKERFILE'
          FROM openfoam10-base:latest AS runner
          COPY simpleFoamExtracted /usr/local/bin/simpleFoamExtracted
          COPY tests/reference/pitzDaily.ref /ref/pitzDaily.ref
          RUN cp -r /opt/openfoam10/tutorials/incompressible/simpleFoam/pitzDaily /case
          WORKDIR /case
          RUN sed -i '/functions/,/^}/d' system/controlDict
          RUN bash -lc "source /opt/openfoam10/etc/bashrc && blockMesh && simpleFoamExtracted" 2>&1 | tee /log.txt

          RUN echo "=== SMOKE ===" && \
              grep -q "SIMPLE solution converged" /log.txt && echo "PASS" || (echo "FAIL" && exit 1)

          RUN set -e; source /ref/pitzDaily.ref; \
              ITERS=$(grep "SIMPLE solution converged in" /log.txt | grep -o '[0-9]*' | tail -1); \
              echo "=== REGRESSION === iterations: $ITERS (ref ${CONVERGED_ITERATIONS}, range ${MIN_ITERATIONS_TOLERANCE}–${MAX_ITERATIONS_TOLERANCE})"; \
              [ "$ITERS" -ge "$MIN_ITERATIONS_TOLERANCE" ] && [ "$ITERS" -le "$MAX_ITERATIONS_TOLERANCE" ] && echo "PASS" || (echo "FAIL" && exit 1)

          RUN set -e; source /ref/pitzDaily.ref; \
              CLOCK=$(grep "ClockTime" /log.txt | tail -1 | grep -o 'ClockTime = [0-9]*' | grep -o '[0-9]*'); \
              echo "=== PERFORMANCE === ${CLOCK}s (limit ${MAX_CLOCK_TIME_SECONDS}s)"; \
              [ "$CLOCK" -le "$MAX_CLOCK_TIME_SECONDS" ] && echo "PASS" || (echo "FAIL" && exit 1)
          DOCKERFILE

      - name: Test — pitzDaily parallel 4×MPI (smoke + performance)
        run: |
          docker build --no-cache -f - -t test-parallel . << 'DOCKERFILE'
          FROM openfoam10-base:latest AS runner
          COPY simpleFoamExtracted /usr/local/bin/simpleFoamExtracted
          RUN cp -r /opt/openfoam10/tutorials/incompressible/simpleFoam/pitzDaily /case
          WORKDIR /case
          RUN sed -i '/functions/,/^}/d' system/controlDict
          RUN printf 'FoamFile\n{\n    version 2.0;\n    format ascii;\n    class dictionary;\n    location "system";\n    object decomposeParDict;\n}\nnumberOfSubdomains 2;\nmethod scotch;\n' > system/decomposeParDict
          RUN bash -lc "source /opt/openfoam10/etc/bashrc && blockMesh && decomposePar && \
              mpirun -n 2 --allow-run-as-root simpleFoamExtracted -parallel" 2>&1 | tee /log.txt
          RUN echo "=== SMOKE ===" && grep -q "SIMPLE solution converged" /log.txt && echo "PASS" || (echo "FAIL" && exit 1)
          RUN CLOCK=$(grep "ClockTime" /log.txt | tail -1 | grep -o 'ClockTime = [0-9]*' | grep -o '[0-9]*'); \
              echo "=== PERFORMANCE === parallel ${CLOCK}s (limit 30s)"; \
              [ "$CLOCK" -le "30" ] && echo "PASS" || (echo "FAIL" && exit 1)
          DOCKERFILE

      - name: Test — airFoil2D (smoke + regression)
        run: |
          docker build --no-cache -f - -t test-airfoil . << 'DOCKERFILE'
          FROM openfoam10-base:latest AS runner
          COPY simpleFoamExtracted /usr/local/bin/simpleFoamExtracted
          COPY tests/reference/airFoil2D.ref /ref/airFoil2D.ref
          RUN cp -r /opt/openfoam10/tutorials/incompressible/simpleFoam/airFoil2D /case
          WORKDIR /case
          RUN sed -i '/functions/,/^}/d' system/controlDict 2>/dev/null || true
          RUN bash -lc "source /opt/openfoam10/etc/bashrc && simpleFoamExtracted" 2>&1 | tee /log.txt
          RUN echo "=== SMOKE ===" && grep -q "SIMPLE solution converged" /log.txt && echo "PASS" || (echo "FAIL" && exit 1)
          RUN set -e; source /ref/airFoil2D.ref; \
              ITERS=$(grep "SIMPLE solution converged in" /log.txt | grep -o '[0-9]*' | tail -1); \
              echo "=== REGRESSION === iterations: $ITERS (ref ${CONVERGED_ITERATIONS}, range ${MIN_ITERATIONS_TOLERANCE}–${MAX_ITERATIONS_TOLERANCE})"; \
              [ "$ITERS" -ge "$MIN_ITERATIONS_TOLERANCE" ] && [ "$ITERS" -le "$MAX_ITERATIONS_TOLERANCE" ] && echo "PASS" || (echo "FAIL" && exit 1)
          DOCKERFILE

      # ── VTK export for ParaView ──────────────────────────────────────────────
      - name: Export pitzDaily results to VTK
        run: |
          mkdir -p vtk-results/pitzDaily vtk-results/airFoil2D

          # pitzDaily: run solver + foamToVTK
          docker build --no-cache -f - -t export-pitzDaily . << 'DOCKERFILE'
          FROM openfoam10-base:latest AS runner
          COPY simpleFoamExtracted /usr/local/bin/simpleFoamExtracted
          RUN cp -r /opt/openfoam10/tutorials/incompressible/simpleFoam/pitzDaily /case
          WORKDIR /case
          RUN sed -i '/functions/,/^}/d' system/controlDict
          RUN bash -lc "source /opt/openfoam10/etc/bashrc && blockMesh && simpleFoamExtracted && foamToVTK"
          DOCKERFILE

          docker create --name vtk-pd export-pitzDaily
          docker cp vtk-pd:/case/VTK vtk-results/pitzDaily/
          docker rm vtk-pd

          # airFoil2D: run solver + foamToVTK
          docker build --no-cache -f - -t export-airfoil . << 'DOCKERFILE'
          FROM openfoam10-base:latest AS runner
          COPY simpleFoamExtracted /usr/local/bin/simpleFoamExtracted
          RUN cp -r /opt/openfoam10/tutorials/incompressible/simpleFoam/airFoil2D /case
          WORKDIR /case
          RUN sed -i '/functions/,/^}/d' system/controlDict 2>/dev/null || true
          RUN bash -lc "source /opt/openfoam10/etc/bashrc && simpleFoamExtracted && foamToVTK"
          DOCKERFILE

          docker create --name vtk-af export-airfoil
          docker cp vtk-af:/case/VTK vtk-results/airFoil2D/
          docker rm vtk-af

          echo "VTK files:"
          find vtk-results -name "*.vtk" | head -20
          du -sh vtk-results/

      - name: Upload VTK results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtk-results-${{ github.sha }}
          path: vtk-results/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Case | Smoke | Regression | Performance |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|------------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| pitzDaily serial | ✅ | ✅ iter ±10% | ✅ <60s |" >> $GITHUB_STEP_SUMMARY
          echo "| pitzDaily 2×MPI (CI: 2 vCPU) | ✅ | — | ✅ <30s |" >> $GITHUB_STEP_SUMMARY
          echo "| airFoil2D        | ✅ | ✅ iter ±10% | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VTK artifacts** available for download (14 days retention):" >> $GITHUB_STEP_SUMMARY
          echo "Fields exported: U (velocity), p (pressure), k, epsilon/nuTilda, nut" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Solver image: \`${{ env.SOLVER_IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
