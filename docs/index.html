<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>simpleFoam_vendored — dependency graph</title>
<style>
  body { margin: 0; background: #1a1a2e; font-family: sans-serif; color: #eee; }
  h1 { text-align: center; padding: 16px 0 4px; font-size: 1.2rem; color: #aaa; font-weight: 300; }
  p.sub { text-align: center; font-size: 0.8rem; color: #555; margin: 0 0 8px; }
  svg { width: 100%; height: calc(100vh - 80px); }
  .link { stroke: #444; stroke-opacity: 0.6; }
  .node circle { stroke: #222; stroke-width: 1.5px; cursor: pointer; }
  .node text { font-size: 11px; fill: #ddd; pointer-events: none; }
  .node .count { font-size: 9px; fill: #888; }
  .tooltip {
    position: absolute; background: #16213e; border: 1px solid #444;
    padding: 8px 12px; border-radius: 6px; font-size: 12px; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
</style>
</head>
<body>
<h1>simpleFoam_vendored — module dependency graph</h1>
<p class="sub">Node size ∝ source file count · hover for details · drag to rearrange</p>
<div class="tooltip" id="tip"></div>
<svg id="graph"></svg>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>

    },
    {

      "color": "#59a14f",
      "sources": 15,
      "radius": 12
    },
    {
      "id": "of_surf",
      "label": "surfMesh",
      "color": "#59a14f",
      "sources": 0,
      "radius": 12
    },
    {
      "id": "of_fv",
      "label": "finiteVolume",
      "color": "#f28e2b",
      "sources": 400,
      "radius": 40
    },
    {
      "id": "of_mt",
      "label": "meshTools",
      "color": "#f28e2b",
      "sources": 195,
      "radius": 27
    },
    {
      "id": "of_pp",
      "label": "physicalProperties",
      "color": "#edc948",
      "sources": 5,
      "radius": 12
    },
    {
      "id": "of_lag",
      "label": "lagrangian/basic",
      "color": "#76b7b2",
      "sources": 0,
      "radius": 12
    },
    {
      "id": "of_sam",
      "label": "sampling",
      "color": "#76b7b2",
      "sources": 61,
      "radius": 14
    },
    {
      "id": "of_mtm",
      "label": "MomentumTransport (base)",
      "color": "#b07aa1",
      "sources": 40,
      "radius": 12
    },
    {
      "id": "of_mti",
      "label": "MomentumTransport (inc.)",
      "color": "#b07aa1",
      "sources": 8,
      "radius": 12
    },
    {
      "id": "of_fvm",
      "label": "fvModels",
      "color": "#ff9da7",
      "sources": 40,
      "radius": 12
    },
    {
      "id": "of_fvc",
      "label": "fvConstraints",
      "color": "#ff9da7",
      "sources": 9,
      "radius": 12
    },
    {
      "id": "simpleFoam",
      "label": "simpleFoamExtracted",
      "color": "#e15759",
      "sources": 1,
      "radius": 22
    }
  ],
  "links": [
    {
      "source": "of_os",
      "target": "of_core"
    },
    {
      "source": "of_pstream",
      "target": "of_core"
    },
    {
      "source": "of_ff",
      "target": "of_core"
    },
    {
      "source": "of_tri",
      "target": "of_core"
    },
    {
      "source": "of_tri",
      "target": "of_ff"
    },
    {
      "source": "of_surf",
      "target": "of_core"
    },
    {
      "source": "of_surf",
      "target": "of_ff"
    },
    {
      "source": "of_surf",
      "target": "of_tri"
    },
    {
      "source": "of_fv",
      "target": "of_core"
    },
    {
      "source": "of_fv",
      "target": "of_mt"
    },
    {
      "source": "of_fv",
      "target": "of_tri"
    },
    {
      "source": "of_mt",
      "target": "of_core"
    },
    {
      "source": "of_mt",
      "target": "of_fv"
    },
    {
      "source": "of_mt",
      "target": "of_surf"
    },
    {
      "source": "of_mt",
      "target": "of_ff"
    },
    {
      "source": "of_pp",
      "target": "of_core"
    },
    {
      "source": "of_pp",
      "target": "of_fv"
    },
    {
      "source": "of_lag",
      "target": "of_core"
    },
    {
      "source": "of_lag",
      "target": "of_mt"
    },
    {
      "source": "of_lag",
      "target": "of_fv"
    },
    {
      "source": "of_sam",
      "target": "of_core"
    },
    {
      "source": "of_sam",
      "target": "of_fv"
    },
    {
      "source": "of_sam",
      "target": "of_mt"
    },
    {
      "source": "of_sam",
      "target": "of_surf"
    },
    {
      "source": "of_sam",
      "target": "of_lag"
    },
    {
      "source": "of_mtm",
      "target": "of_core"
    },
    {
      "source": "of_mtm",
      "target": "of_fv"
    },
    {
      "source": "of_mtm",
      "target": "of_mt"
    },
    {
      "source": "of_mtm",
      "target": "of_pp"
    },
    {
      "source": "of_mti",
      "target": "of_mtm"
    },
    {
      "source": "of_fvm",
      "target": "of_core"
    },
    {
      "source": "of_fvm",
      "target": "of_fv"
    },
    {
      "source": "of_fvm",
      "target": "of_mt"
    },
    {
      "source": "of_fvm",
      "target": "of_sam"
    },
    {
      "source": "of_fvc",
      "target": "of_core"
    },
    {
      "source": "of_fvc",
      "target": "of_fv"
    },
    {
      "source": "of_fvc",
      "target": "of_mt"
    },
    {
      "source": "simpleFoam",
      "target": "of_fv"
    },
    {
      "source": "simpleFoam",
      "target": "of_mt"
    },
    {
      "source": "simpleFoam",
      "target": "of_pp"
    },
    {
      "source": "simpleFoam",
      "target": "of_mtm"
    },
    {
      "source": "simpleFoam",
      "target": "of_mti"
    },
    {
      "source": "simpleFoam",
      "target": "of_sam"
    },
    {
      "source": "simpleFoam",
      "target": "of_fvm"
    },
    {
      "source": "simpleFoam",
      "target": "of_fvc"
    }
  ]
};

const svg = d3.select("#graph");
const W = window.innerWidth, H = window.innerHeight - 80;
svg.attr("viewBox", [0, 0, W, H]);

const sim = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(120))
  .force("charge", d3.forceManyBody().strength(-400))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("collision", d3.forceCollide(d => d.radius + 10));

const link = svg.append("g").selectAll("line")
  .data(data.links).join("line").attr("class","link").attr("stroke-width", 1.5);

const node = svg.append("g").selectAll("g")
  .data(data.nodes).join("g").attr("class","node")
  .call(d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end",   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append("circle")
  .attr("r", d => d.radius)
  .attr("fill", d => d.color)
  .on("mouseover", (e,d) => {
    const tip = document.getElementById("tip");
    tip.innerHTML = `<b>${d.label}</b><br>Module: ${d.id}<br>Source files: ${d.sources}`;
    tip.style.opacity = 1;
    tip.style.left = (e.pageX+12)+"px";
    tip.style.top  = (e.pageY-28)+"px";
  })
  .on("mousemove", e => {
    const tip = document.getElementById("tip");
    tip.style.left = (e.pageX+12)+"px";
    tip.style.top  = (e.pageY-28)+"px";
  })
  .on("mouseout", () => { document.getElementById("tip").style.opacity = 0; });

node.append("text").attr("dy", "0.35em").attr("text-anchor","middle")
  .text(d => d.id === "simpleFoam" ? "simpleFoam" : d.id.replace("of_",""));

node.append("text").attr("class","count").attr("dy","1.6em").attr("text-anchor","middle")
  .text(d => d.sources > 0 ? d.sources+" .C" : "");

sim.on("tick", () => {
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform",d=>`translate(${d.x},${d.y})`);
});
</script>
</body>
</html>
